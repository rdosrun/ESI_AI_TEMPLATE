name: esi-ai-solutions-architect-starter
metadata:
  template: esi-ai-solutions-architect-starter@0.1.0

infra:
  provider: bicep
  path: infra

services:
  agent-builder:
    project: agent_builder
    host: staticwebapp
    dist: build/web
    hooks:
      prepackage:
        shell: sh
        run: flutter pub get && flutter build web --release
  api:
    project: src/api
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      context: ../..
