name: Agent Builder Web

on:
  pull_request:
    paths:
      - "agent_builder/**"
      - ".github/workflows/agent-builder.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the validated build to Azure Static Web Apps"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: agent_builder
        run: flutter pub get

      - name: Analyze
        working-directory: agent_builder
        run: flutter analyze

      - name: Test
        working-directory: agent_builder
        run: flutter test

      - name: Build web release
        working-directory: agent_builder
        run: flutter build web --release

      - name: Upload validated web artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-builder-web
          path: agent_builder/build/web
          if-no-files-found: error

  deploy:
    name: Deploy Agent Builder
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    environment: agent-builder
    steps:
      - name: Download validated web artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-builder-web
          path: agent_builder/build/web

      # TODO: Configure AZURE_STATIC_WEB_APPS_API_TOKEN_AGENT_BUILDER in the
      # protected agent-builder GitHub environment after provisioning Azure.
      - name: Deploy static files
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGENT_BUILDER }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: agent_builder/build/web
          skip_app_build: true
